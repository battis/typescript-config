allowBuilds:
  nx: true
  unrs-resolver: true
  '@parcel/watcher': false
  gifsicle: false
  jpegtran-bin: false
  optipng-bin: false
  sharp: false
minimumReleaseAgeExclude:
  - '@qui-cli/*'
packages:
  - packages/*
publicHoistPattern:
  - '*prettier*'
  - '*eslint*'
  - '@commitlint/*'
  - commit-and-tag-version
  - lerna
  - monorepo-package-paths
  - npm-run-all
catalogs:
  prod:
    # script utilities
    commit-and-tag-version: ~13.1.2
    copyfiles: ~2.4.1
    del-cli: ~7.0.0
    npm-run-all: ~4.1.5

    # Node/TypeScript
    typescript: ~5.9.3
    '@types/node': ~24.13.3
    '@tsconfig/node-lts': ~24.0.0
    '@tsconfig/recommended': ~1.0.13

    # cli apps
    '@inquirer/input': ~5.1.2
    '@qui-cli/colors': ~3.2.4
    '@qui-cli/core': ~7.0.0
    '@qui-cli/init': ~1.1.1
    '@qui-cli/log': ~4.0.4
    '@qui-cli/markdown': ~2.0.1
    '@qui-cli/plugin': ~4.1.2
    '@qui-cli/root': ~3.1.1
    '@qui-cli/shell': ~3.1.4
    '@qui-cli/validators': ~3.0.5
    ora: ~9.4.1

    # unit tests
    ts-jest: ^29.4.12
    jest: ^30.4.2
    '@types/jest': ^30.0.0

  dev:
    '@qui-cli/colors': 3.2.5-0
    '@qui-cli/core': 7.1.0-0
    '@qui-cli/init': ~2.0.0
    '@qui-cli/log': 4.0.5-0
    '@qui-cli/plugin': 4.2.0-0

  common-peer:
    prettier: ^3.9.6
    package-json-type: ^1.1.2
