allowBuilds:
  nx: true
  unrs-resolver: true
  "@parcel/watcher": false
  gifsicle: false
  jpegtran-bin: false
  optipng-bin: false
  sharp: false
packages:
  - packages/*
publicHoistPattern:
  - "*prettier*"
  - "*eslint*"
  - "@commitlint/*"
  - commit-and-tag-version
  - lerna
  - monorepo-package-paths
  - npm-run-all
