publicHoistPattern:
  - '*eslint*' # @battis/eslint
  - '*prettier*' # @battis/prettier

allowBuilds:
  # development environment
  nx: true # lerna
  unrs-resolver: true # jest

  # @battis/webpack peer dependencies needed for webpack builds only
  '@parcel/watcher': false # sass
  gifsicle: false
  jpegtran-bin: false
  optipng-bin: false
  sharp: false

packages:
  - packages/*
